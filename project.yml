name: DeepGlass
options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  DeepGlass-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core/Sources/DeepSeekKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepglass.app
        PRODUCT_NAME: DeepGlass
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 语音输入需要语音识别权限
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  DeepGlass-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core/Sources/DeepSeekKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepglass.app
        PRODUCT_NAME: DeepGlass
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 语音输入需要语音识别权限
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  DeepGlass-macOS:
    build:
      targets:
        DeepGlass-macOS: all
    run:
      config: Debug
  DeepGlass-iOS:
    build:
      targets:
        DeepGlass-iOS: all
    run:
      config: Debug
